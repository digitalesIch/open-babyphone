<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Babyphone social preview</title>
  <style>
    :root {
      --background: #080b12;
      --surface: #101827;
      --surface-variant: #1a2235;
      --foreground: #f6f7fb;
      --muted: #a5b2c8;
      --outline: rgba(90, 106, 130, 0.46);
      --primary: #5ff2d2;
      --secondary: #5da8ff;
      --font: Roboto, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font);
    }

    .canvas {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 0.96fr 1.04fr;
      align-items: center;
      gap: 4%;
      padding: 5.5%;
      background: var(--background);
    }

    .copy {
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 44px;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
    }

    h1 {
      max-width: 600px;
      margin: 0;
      font-size: clamp(46px, 5.4vw, 76px);
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    p {
      max-width: 520px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 1.65vw, 22px);
      line-height: 1.45;
    }

    .principles {
      display: flex;
      gap: 14px;
      margin-top: 36px;
      color: var(--primary);
      font-size: clamp(12px, 1.1vw, 15px);
      font-weight: 800;
    }

    .principles span + span {
      padding-left: 14px;
      border-left: 1px solid var(--outline);
    }

    .visual {
      height: 88%;
      position: relative;
      isolation: isolate;
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: 12% 2% 10% 6%;
      z-index: -1;
      border-radius: 48px;
      background: radial-gradient(circle at 70% 40%, rgba(93, 168, 255, 0.16), transparent 62%);
    }

    .phone {
      position: absolute;
      width: 39%;
      aspect-ratio: 1 / 2;
      overflow: hidden;
      border: 1px solid var(--outline);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 28px 56px rgba(0, 0, 0, 0.36);
    }

    .phone:first-child {
      top: 0;
      left: 0;
    }

    .phone:nth-of-type(2) {
      right: 0;
      bottom: 0;
    }

    .phone img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: top center;
    }

  </style>
</head>
<body>
  <main class="canvas">
    <section class="copy">
      <div class="brand">
        <img src="logo.svg" width="48" height="48" alt="">
        <span>Open Babyphone</span>
      </div>
      <h1>Turn two phones into your new babyphone.</h1>
      <p>Verified live audio over your local network. No account or hosted relay.</p>
      <div class="principles">
        <span>Android 11+</span>
        <span>Open source</span>
        <span>Local by design</span>
      </div>
    </section>

    <section class="visual" aria-label="Open Babyphone app screens">
      <figure class="phone">
        <img src="assets/app/role-chooser-dark.webp" alt="Open Babyphone role chooser">
      </figure>
      <figure class="phone">
        <img src="assets/app/listening-loud-dark.webp" alt="Open Babyphone listening screen">
      </figure>
    </section>
  </main>
</body>
</html>
